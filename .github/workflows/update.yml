name: עדכון הגרלות

on:
  schedule:
    - cron: "*/10 * * * *"      # כל 10 דקות (GitHub עלול לעכב בכמה דקות)
  workflow_dispatch:            # הרצה ידנית מלשונית Actions
  push:
    branches: [main]
    paths: ["app/**", "method.py", "server.py", "build_site.py", "build_strategic.py", "strategic/**"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests tzdata
      - run: python build_strategic.py
      - run: python build_site.py
        continue-on-error: true
      - name: שמירת השינויים
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/chance.csv data/predictions.json strategic/draws.json
          git diff --cached --quiet || (git commit -m "עדכון הגרלות" && git push)
