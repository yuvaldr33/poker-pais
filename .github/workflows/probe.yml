name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -A "Mozilla/5.0" "https://www.myloto.co.il/%D7%A6%D7%90%D7%A0%D7%A1" -o m.html
          python3 -c "import re;h=open('m.html',encoding='utf-8',errors='ignore').read();[print('=====',m.start(),h[max(0,m.start()-300):m.start()+1800]) for m in re.finditer('5386[0-9]',h)]"
