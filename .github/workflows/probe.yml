name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -A "Mozilla/5.0" "https://www.myloto.co.il/%D7%A6%D7%90%D7%A0%D7%A1" -o m.html -w "code %{http_code} size %{size_download}\n"
          grep -o '5386[0-9]' m.html | sort | uniq -c
          grep -oE '(src|href)="[^"]*\.(js|json)[^"]*"' m.html | head -30
          grep -oiE '(api|ajax|fetch|json)[^"'"'"' ]{0,80}' m.html | sort -u | head -40
          python3 - <<'PY'
          import re;h=open('m.html',encoding='utf-8',errors='ignore').read()
          i=h.find('53860');print(h[max(0,i-1500):i+1500])
          PY
